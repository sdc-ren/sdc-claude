name: tf

on:
  pull_request:
    paths: ['plugins/tf/**', '.github/workflows/tf.yml']
  push:
    branches: [main]
    paths: ['plugins/tf/**', '.github/workflows/tf.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A PR runs 4 jobs: the oldest and newest Node on Linux, and the newest on macOS and Windows — operating
      # systems break the platform layer far more often than Node versions do. A push to main runs all 9.
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26},{"os":"windows-latest","node":22},{"os":"windows-latest","node":24},{"os":"windows-latest","node":26}]' || '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":26},{"os":"windows-latest","node":26}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scripts parse
        shell: bash
        run: for f in plugins/tf/scripts/*.mjs plugins/tf/core/*.mjs plugins/tf/modules/*/*.mjs plugins/tf/cli/*.mjs plugins/tf/hosts/*/*.mjs plugins/tf/engine/src/*.mjs plugins/tf/build/*.mjs; do node --check "$f"; done
      - name: Generated files match their sources (host builds)
        run: node plugins/tf/hosts/claude/build.mjs --check && node --test plugins/tf/tests/build.mjs
      - name: Core layer (paths, config, naming, guard rules)
        run: node --test plugins/tf/tests/core.mjs
      - name: tf command line (every command, same output as the old scripts)
        run: node --test plugins/tf/tests/cli.mjs
      - name: Layer boundaries (imports point inward, core names no agent)
        run: node --test plugins/tf/tests/boundaries.mjs
      - name: Executor rules (mock agents), Workflow bundle
        run: node --test plugins/tf/tests/engine.mjs
      - name: Executor rules (mock agents), ES module other hosts import
        run: node --test plugins/tf/tests/engine.mjs
        env:
          TF_ENGINE: src
      - name: Platform layer (this operating system)
        run: node --test plugins/tf/tests/platform.mjs
      - name: Task input (any link, plain words, keys)
        run: node --test plugins/tf/tests/sources.mjs
      - name: Canvas → clickable demo
        run: node --test plugins/tf/tests/canvas.mjs
      - name: Chat digest (Zalo reader, stub page)
        run: node --test plugins/tf/tests/digest.mjs
      - name: Review round (one answer per PR)
        run: node --test plugins/tf/tests/feedback.mjs
      - name: E2E test cases (parse, approve, status, results)
        run: node --test plugins/tf/tests/cases.mjs
      - name: E2E runner (fake flows) and evidence marking
        run: node --test plugins/tf/tests/flow-run.mjs plugins/tf/tests/annotate.mjs
      - name: Task lock and commit fingerprint
        run: node --test plugins/tf/tests/task.mjs
      - name: Resource ledger (one holder per id, status table)
        run: node --test plugins/tf/tests/resources.mjs
      - name: Jira (markdown to comment, dry run, checks)
        run: node --test plugins/tf/tests/jira.mjs
      - name: Commit and PR naming (git.md)
        run: node --test plugins/tf/tests/naming.mjs
      - name: Security scan (secrets, logs, new dependencies)
        run: node --test plugins/tf/tests/security-scan.mjs

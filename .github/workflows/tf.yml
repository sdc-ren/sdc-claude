name: tf

on:
  pull_request:
    paths: ['plugins/tf/**', '.github/workflows/tf.yml']
  push:
    branches: [main]
    paths: ['plugins/tf/**', '.github/workflows/tf.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Scripts parse
        shell: bash
        run: for f in plugins/tf/scripts/*.mjs; do node --check "$f"; done
      - name: Executor rules (mock agents)
        run: node --test plugins/tf/tests/engine.mjs
      - name: Platform layer (this operating system)
        run: node --test plugins/tf/tests/platform.mjs
      - name: Task input (any link, plain words, keys)
        run: node --test plugins/tf/tests/sources.mjs
      - name: Canvas → clickable demo
        run: node --test plugins/tf/tests/canvas.mjs
      - name: Chat digest (Zalo reader, stub page)
        run: node --test plugins/tf/tests/digest.mjs
      - name: Review round (one answer per PR)
        run: node --test plugins/tf/tests/feedback.mjs
      - name: E2E test cases (parse, approve, status, results)
        run: node --test plugins/tf/tests/cases.mjs
      - name: E2E runner (fake flows) and evidence marking
        run: node --test plugins/tf/tests/flow-run.mjs plugins/tf/tests/annotate.mjs
      - name: Task lock and commit fingerprint
        run: node --test plugins/tf/tests/task.mjs
      - name: Resource ledger (one holder per id, status table)
        run: node --test plugins/tf/tests/resources.mjs
      - name: Jira (markdown to comment, dry run, checks)
        run: node --test plugins/tf/tests/jira.mjs
